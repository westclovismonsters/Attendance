<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Clovis Monsters | Attendance</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FBF8F2; }
  iframe { border:0; width:100%; height:100vh; display:block; }
  .fallback {
    font-family: Arial, sans-serif; text-align:center; padding: 60px 20px; color:#6e0006;
  }
  .fallback a {
    display:inline-block; margin-top:16px; padding:12px 24px; background:#980008; color:#fff;
    text-decoration:none; border-radius:6px; font-weight:bold;
  }
</style>
</head>
<body>
  <!--
    Desktop: embeds the Apps Script tracker in an iframe, which hides Google's automatic
    "created by a Google Apps Script user" banner.

    Mobile (iOS Safari/Chrome, Android): iframing an Apps Script /exec URL is unreliable --
    it can silently fail to load. So on mobile we skip the iframe entirely and just redirect
    straight to the real URL. Mobile users will see Google's small blue banner (dismissible),
    which is a fair trade for the page actually loading every time.

    If the Apps Script Web App URL ever changes (a brand-new deployment rather than
    "New version" on the existing one), update APP_URL below to match.
  -->
  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyjZqtg7wuatznn-A7_t6AXq5f6VCOLIwu5apLY7RlF2y-DIfH1kf9oMV3D9Eu_oDFT/exec";
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (isMobile) {
      window.location.replace(APP_URL);
    } else {
      document.write(
        '<iframe src="' + APP_URL + '" title="West Clovis Monsters Attendance Tracker" allow="clipboard-write"></iframe>'
      );
    }
  </script>

  <noscript>
    <div class="fallback">
      <p>This page needs JavaScript enabled to load the attendance tracker.</p>
      <a href="https://script.google.com/macros/s/AKfycbyjZqtg7wuatznn-A7_t6AXq5f6VCOLIwu5apLY7RlF2y-DIfH1kf9oMV3D9Eu_oDFT/exec">Open Attendance Tracker</a>
    </div>
  </noscript>
</body>
</html>
