<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>West Clovis Monsters | Attendance</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#FBF8F2; }
  iframe { border:0; width:100%; height:100vh; display:block; }
  .fallback {
    font-family: Arial, sans-serif; text-align:center; padding: 60px 20px; color:#6e0006;
  }
  .fallback a {
    display:inline-block; margin-top:16px; padding:12px 24px; background:#980008; color:#fff;
    text-decoration:none; border-radius:6px; font-weight:bold;
  }
</style>
</head>
<body>
  <!--
    Embeds the Apps Script tracker in an iframe on every device, which hides Google's
    automatic "created by a Google Apps Script user" banner. The banner-on-mobile issue
    earlier was caused by the wrapper pointing at a stale, wrong deployment URL, not by
    mobile being unable to load the iframe -- so this now just iframes it everywhere.

    If the Apps Script Web App URL ever changes (a brand-new deployment rather than
    "New version" on the existing one), update the src below to match.
  -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbyjZqtg7wuatznn-A7_t6AXq5f6VCOLIwu5apLY7RlF2y-DIfH1kf9oMV3D9Eu_oDFT/exec"
    title="West Clovis Monsters Attendance Tracker"
    allow="clipboard-write"
  ></iframe>

  <noscript>
    <div class="fallback">
      <p>This page needs JavaScript enabled to load the attendance tracker.</p>
      <a href="https://script.google.com/macros/s/AKfycbyjZqtg7wuatznn-A7_t6AXq5f6VCOLIwu5apLY7RlF2y-DIfH1kf9oMV3D9Eu_oDFT/exec">Open Attendance Tracker</a>
    </div>
  </noscript>
</body>
</html>
